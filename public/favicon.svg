<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023859" />
      <stop offset="50%" stop-color="#011C40" />
      <stop offset="100%" stop-color="#001026" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7EBF2" />
      <stop offset="50%" stop-color="#54ACBF" />
      <stop offset="100%" stop-color="#26658C" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54ACBF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A7EBF2" stop-opacity="0.9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="20" />

  <!-- Inner Soft Ring -->
  <rect x="48" y="48" width="416" height="416" rx="104" fill="none" stroke="#26658C" stroke-width="4" stroke-opacity="0.5" />

  <!-- Play Symbol with Cinematic Neon Glow -->
  <g filter="url(#neonGlow)">
    <!-- Main Triangle Play Button -->
    <path d="M 210 160 L 360 256 L 210 352 Z" fill="url(#cyanGrad)" stroke="#A7EBF2" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Accent Shimmer Dot -->
  <circle cx="360" cy="170" r="14" fill="#A7EBF2" filter="url(#neonGlow)" />
  <circle cx="170" cy="340" r="10" fill="#54ACBF" opacity="0.7" />
</svg>
